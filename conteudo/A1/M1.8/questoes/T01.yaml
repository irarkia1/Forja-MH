- id: Q-M1.8.T01-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Qual destes sensores é autogerador, ou seja, tira do próprio fenômeno a energia do sinal, sem precisar de excitação externa?
  alternativas:
    - "Termistor NTC"
    - "Strain gauge"
    - "Termopar"
    - "Fotorresistor (LDR)"
  resposta: 2
  explicacao: |
    O termopar gera uma tensão pelo efeito Seebeck. NTC, strain gauge e LDR são modulantes: só mudam de resistência, e é preciso uma corrente ou tensão de excitação para transformar essa mudança em sinal.
  fonte: "Fraden, Handbook of Modern Sensors, Data Acquisition (Sensor Classification)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-002
  objetivo: O1
  tipo: multipla
  dificuldade: 2
  bloom: entender
  enunciado: |
    Na cadeia de medição transdutor → condicionamento → ADC → calibração → filtro, quais blocos pertencem ao condicionamento analógico, antes do conversor?
  alternativas:
    - "Amplificador de instrumentação que eleva o sinal de milivolts de uma ponte"
    - "Correção de offset e de ganho com coeficientes gravados na EEPROM"
    - "Filtro RC anti-aliasing na entrada do ADC"
    - "Média móvel de 16 amostras feita no firmware"
  resposta: [0, 2]
  explicacao: |
    O amplificador e o filtro anti-aliasing agem sobre o sinal analógico, antes da conversão. A correção de offset e de ganho é a calibração, feita sobre os códigos já convertidos, e a média móvel é um filtro digital: ambos ficam depois do ADC.
  fonte: "Fraden, Handbook of Modern Sensors, Data Acquisition e Interface Electronic Circuits"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-003
  objetivo: O1
  tipo: vf
  dificuldade: 2
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: no Handbook of Modern Sensors, Fraden chama de "passivo" o sensor que gera o sinal sem energia externa (como o termopar) e de "ativo" o que precisa de excitação (como o termistor), embora parte da literatura de eletrônica use os termos ao contrário.
  resposta: true
  explicacao: |
    Fraden classifica como passivo o sensor que não precisa de fonte adicional e gera o sinal diretamente (termopar, fotodiodo, piezoelétrico), e como ativo o que precisa de excitação (termistor, strain gauge). Em catálogos, "ativo" costuma significar "com eletrônica dentro". Por isso vale dizer "autogerador" e "modulante" e explicar o que se quer dizer.
  fonte: "Fraden, Handbook of Modern Sensors, Data Acquisition (Sensor Classification)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-004
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Um transmissor de pressão de 0 a 10 bar tem saída de 4 a 20 mA, lida como tensão sobre um resistor de 165 Ω. O ADC mede 2,31 V nesse resistor. Qual é a pressão? Responda em bar, com 2 casas decimais.
  resposta: {valor: 6.25, unidade: "bar", tolerancia: 0.01}
  explicacao: |
    I = 2,31 V / 165 Ω = 14 mA. A fração da faixa é (14 − 4)/(20 − 4) = 0,625, e 0,625 × 10 bar = 6,25 bar. O zero vivo de 4 mA permite detectar o laço aberto: 0 mA (0 V) é falha, e não 0 bar.
  fonte: "Fraden, Handbook of Modern Sensors, Interface Electronic Circuits; TI, Analog Engineer's Pocket Reference"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-005
  objetivo: O2
  tipo: vf
  dificuldade: 1
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: um sensor digital com resolução de 0,0625 °C garante que a temperatura medida está a no máximo 0,0625 °C da temperatura verdadeira.
  resposta: false
  explicacao: |
    Resolução é o menor passo que o sensor distingue; exatidão é a distância ao valor verdadeiro. O DS18B20 tem resolução de 0,0625 °C em 12 bits e exatidão de ±0,5 °C entre −10 e +85 °C, oito vezes maior que o passo.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Accuracy, Resolution); Maxim, DS18B20 datasheet"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-006
  objetivo: O2
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um TMP36 (10 mV/°C) é lido por um ADC de 10 bits com a referência interna de 1,1 V. Qual é a resolução em temperatura, em °C por LSB? Responda com 3 casas decimais.
  resposta: {valor: 0.107, unidade: "°C/LSB", tolerancia: 0.01}
  explicacao: |
    LSB = 1,1 V / 1024 = 1,074 mV. Dividindo pela sensibilidade de 10 mV/°C: 0,107 °C por LSB. Com AVCC de 5 V, o LSB seria de 4,88 mV, ou 0,49 °C por LSB. A troca de referência também reduz a faixa: com 1,1 V, o TMP36 (500 mV a 0 °C) satura em 60 °C.
  fonte: "Analog Devices, TMP35/TMP36/TMP37 datasheet; Microchip, ATmega328P datasheet, Analog-to-Digital Converter"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-007
  objetivo: O2
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Num canal de temperatura, três erros independentes valem ±0,4 °C (sensor), ±0,3 °C (referência do ADC) e ±0,2 °C (não linearidade do ADC). Qual é o erro combinado pela raiz da soma dos quadrados (RSS)? Responda em °C, com 2 casas decimais.
  resposta: {valor: 0.54, unidade: "°C", tolerancia: 0.01}
  explicacao: |
    RSS = √(0,4² + 0,3² + 0,2²) = √0,29 ≈ 0,54 °C. O pior caso, que soma tudo, daria 0,9 °C. A combinação quadrática vale para erros independentes e aleatórios; para garantir uma especificação, use o pior caso.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Uncertainty)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-008
  objetivo: O2
  tipo: numerica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Um sensor de pressão de 0 a 6 bar dá de 0,5 V a 4,5 V. A saída passa por um divisor de 10 kΩ (em cima) e 20 kΩ (embaixo), que multiplica a tensão por 2/3, e chega a um ADC de 12 bits com referência de 3,3 V. Qual é a resolução em pressão, em mbar por LSB? Responda com 2 casas decimais.
  resposta: {valor: 1.81, unidade: "mbar/LSB", tolerancia: 0.01}
  explicacao: |
    LSB no pino do ADC = 3,3/4096 = 0,8057 mV; na saída do sensor, 0,8057 × 3/2 = 1,2085 mV. A sensibilidade é 4 V / 6 bar = 0,6667 V/bar = 0,6667 mV/mbar. Resolução = 1,2085/0,6667 ≈ 1,81 mbar por LSB. O divisor leva o fundo de escala a 3,0 V, abaixo da referência, e a faixa útil vai de 0,33 V a 3,0 V.
  fonte: "TI, Analog Engineer's Pocket Reference (conversores de dados: LSB); Fraden, Handbook of Modern Sensors, Transfer Functions"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-009
  objetivo: O3
  tipo: unica
  dificuldade: 1
  bloom: entender
  enunciado: |
    Qual destes erros não pode ser removido por uma calibração de offset e ganho, porque o mesmo valor verdadeiro produz leituras diferentes conforme o caminho percorrido?
  alternativas:
    - "Erro de offset"
    - "Erro de sensibilidade (ganho)"
    - "Erro da referência do ADC"
    - "Histerese"
  resposta: 3
  explicacao: |
    Na histerese, a saída depende de a grandeza estar subindo ou descendo: não existe uma única correção para cada leitura. Offset, ganho e erro de referência são sistemáticos e repetíveis, e uma calibração de dois pontos os corrige.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Hysteresis, Calibration)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-010
  objetivo: O3
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um sensor de pressão de 0 a 200 kPa tem exatidão de ±0,25 % do fundo de escala (FS). Qual é o erro relativo máximo, em relação à própria leitura, quando ele mede 20 kPa? Responda em %, com 1 casa decimal.
  resposta: {valor: 2.5, unidade: "%", tolerancia: 0.01}
  explicacao: |
    0,25 % × 200 kPa = ±0,5 kPa em qualquer ponto da escala. A 20 kPa, 0,5/20 = 2,5 % da leitura: dez vezes o número do datasheet. Escolha a faixa do sensor próxima da faixa de uso.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Accuracy)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-011
  objetivo: O3
  tipo: multipla
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Um protótipo usa um MQ-135 para "medir CO₂ em ppm", lendo o sensor um minuto depois de ligado e aplicando a curva típica do datasheet. Quais críticas são procedentes?
  alternativas:
    - "O sensor responde a vários gases (amônia, álcool, benzeno, fumaça), então a leitura não é seletiva para CO₂"
    - "Sem pré-aquecimento, a camada de óxido ainda está derivando, e a leitura não é estável"
    - "A curva típica dispensa calibração, porque o R₀ é igual em todas as peças"
    - "As curvas dependem da temperatura e da umidade, que precisam ser compensadas"
  resposta: [0, 1, 3]
  explicacao: |
    O MQ-135 é um sensor de óxido metálico com sensibilidade cruzada, que exige pré-aquecimento (24 a 48 h na primeira vez) e cujas curvas mudam com temperatura e umidade. O R₀ varia de peça para peça, e por isso é preciso calibrar com um gás conhecido. Para CO₂ em ppm, a escolha certa é um sensor NDIR.
  fonte: "Hanwei/Winsen, MQ-135 datasheet; Fraden, Handbook of Modern Sensors, Chemical and Biological Sensors"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-012
  objetivo: O4
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um sensor de umidade tem resposta de primeira ordem com constante de tempo τ63 = 8 s. Qual é o seu t90, isto é, o tempo para atingir 90 % de um degrau? Responda em s, com 1 casa decimal.
  resposta: {valor: 18.4, unidade: "s", tolerancia: 0.01}
  explicacao: |
    t90 = τ·ln(10) = 8 × 2,3026 ≈ 18,4 s. Em primeira ordem: t63 = τ, t90 ≈ 2,3τ, t95 ≈ 3τ e t99 ≈ 4,6τ.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Dynamic Characteristics); Sensirion, SHT3x datasheet (Response time)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-013
  objetivo: O4
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Uma sonda de temperatura com τ = 40 s acompanha um forno que aquece a 1,5 °C/min, em rampa constante. Depois do transitório inicial, de quanto a leitura fica atrasada em relação à temperatura real? Responda em °C, com 1 casa decimal.
  resposta: {valor: 1.0, unidade: "°C", tolerancia: 0.01}
  explicacao: |
    Numa rampa de taxa r, um sistema de primeira ordem fica atrasado de r·τ: (1,5/60) °C/s × 40 s = 1,0 °C. O erro não some enquanto a rampa durar; só diminui com uma sonda mais rápida (menor massa térmica, melhor contato) ou compensando o atraso no firmware.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Dynamic Characteristics)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T01-014
  objetivo: O4
  tipo: numerica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Uma sonda de primeira ordem com τ = 12 s sofre um degrau de 30 °C. Quanto tempo depois do degrau o erro cai abaixo de 0,1 °C? Responda em s, com 1 casa decimal.
  resposta: {valor: 68.4, unidade: "s", tolerancia: 0.01}
  explicacao: |
    O erro é 30·e^(−t/τ). Para 0,1 °C: e^(−t/12) = 0,1/30, então t = 12 × ln(300) = 12 × 5,704 ≈ 68,4 s, ou cerca de 5,7τ. Numa linha de produção que testa sondas, esse é o tempo mínimo de espera antes de comparar com a referência.
  fonte: "Fraden, Handbook of Modern Sensors, Sensor Characteristics (Dynamic Characteristics)"
  origem: ia
  revisao: rascunho
