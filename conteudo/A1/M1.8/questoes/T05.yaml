- id: Q-M1.8.T05-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Num amp-op ideal com realimentação negativa, quais são as duas regras usadas para analisar o circuito?
  alternativas:
    - "A saída é sempre zero, e as entradas puxam a corrente que for preciso"
    - "A saída faz o que for preciso para que as duas entradas fiquem na mesma tensão, e as entradas não puxam corrente"
    - "A entrada inversora fica sempre em 0 V, e a saída fica sempre em um dos trilhos"
    - "O ganho é sempre 1, e a impedância de saída é infinita"
  resposta: 1
  explicacao: |
    São as "regras de ouro" de Horowitz e Hill: com realimentação negativa, a saída ajusta-se até V+ = V−, e as entradas têm impedância infinita. A entrada inversora só fica em 0 V quando a não inversora está no terra (o "terra virtual" da configuração inversora). Ficar presa num trilho é o comportamento sem realimentação, como comparador.
  fonte: "Horowitz & Hill, The Art of Electronics, Operational Amplifiers (golden rules)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-002
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um amplificador não inversor tem R_f = 47 kΩ (da saída para a entrada inversora) e R_g = 2,2 kΩ (da entrada inversora ao terra). Qual é o ganho de tensão? Responda adimensional, com 2 casas decimais.
  resposta: {valor: 22.36, unidade: "V/V", tolerancia: 0.01}
  explicacao: |
    G = 1 + R_f/R_g = 1 + 47/2,2 ≈ 22,36. Um sinal de 120 mV vira cerca de 2,68 V. O "1 +" é o que distingue a não inversora da inversora, cujo ganho seria −R_f/R_in = −21,36.
  fonte: "Horowitz & Hill, The Art of Electronics, Operational Amplifiers; TI, Analog Engineer's Pocket Reference (configurações de amplificador)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-003
  objetivo: O1
  tipo: multipla
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Você precisa amplificar o sinal de um sensor para o ADC de um STM32 alimentado em 3,3 V, com o amp-op na mesma alimentação única. Quais afirmações estão corretas?
  alternativas:
    - "Um LM358 serve bem, porque sua saída vai até o VCC"
    - "Um amp-op de entrada e saída rail-to-rail (RRIO) de baixa tensão, como o MCP6002 ou o TLV9002, é a escolha adequada"
    - "Mesmo um amp-op rail-to-rail fica algumas dezenas de milivolts longe dos trilhos com carga, então o projeto deve deixar folga"
    - "A banda em malha fechada não depende do ganho escolhido"
  resposta: [1, 2]
  explicacao: |
    O LM358 não é rail-to-rail: a saída fica cerca de 1,5 V abaixo do VCC, e a entrada de modo comum também não chega ao VCC, o que o inviabiliza em 3,3 V. Um RRIO de baixa tensão resolve, mas a saída nunca encosta exatamente nos trilhos. A banda em malha fechada é aproximadamente GBW/G: quanto mais ganho, menos banda.
  fonte: "Horowitz & Hill, The Art of Electronics, Operational Amplifiers (single-supply e rail-to-rail); Mancini, Op Amps for Everyone (single-supply op amp design)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-004
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um amp-op com produto ganho-banda de 1 MHz é ligado como não inversor com ganho 50. Qual é, aproximadamente, a banda em malha fechada? Responda em kHz, sem casas decimais.
  resposta: {valor: 20, unidade: "kHz", tolerancia: 0.01}
  explicacao: |
    Banda ≈ GBW/G = 1 MHz/50 = 20 kHz. Sobra para temperatura, pressão e corrente lenta, mas não para áudio de alta qualidade. Para ganhos altos e banda larga, divida o ganho em dois estágios.
  fonte: "Mancini, Op Amps for Everyone (produto ganho-banda); Horowitz & Hill, The Art of Electronics, Operational Amplifiers"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-005
  objetivo: O2
  tipo: vf
  dificuldade: 1
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: numa ponte de Wheatstone equilibrada (R1/R2 = R3/R4), a tensão de saída é zero qualquer que seja a tensão de excitação.
  resposta: true
  explicacao: |
    Com as razões iguais, os dois divisores dão a mesma fração de V_ex, e a diferença é zero para qualquer V_ex. É isso que faz a ponte medir só a variação em torno do equilíbrio: o restante da tensão vira modo comum, que o amplificador de instrumentação rejeita.
  fonte: "Fraden, Handbook of Modern Sensors, Interface Electronic Circuits (Bridge Circuits)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-006
  objetivo: O2
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um quarto de ponte com resistores iguais é alimentado com 3,3 V. O extensômetro ativo tem fator GF = 2 e sofre 800 µε. Usando a aproximação V_out ≈ V_ex·(ΔR/R)/4, qual é a tensão de saída? Responda em mV, com 2 casas decimais.
  resposta: {valor: 1.32, unidade: "mV", tolerancia: 0.01}
  explicacao: |
    ΔR/R = GF·ε = 2 × 800 × 10⁻⁶ = 0,0016. V_out ≈ 3,3 × 0,0016/4 = 1,32 mV. É um sinal de milivolts em cima de 1,65 V de modo comum: precisa de amplificador de instrumentação, não de um amp-op simples.
  fonte: "Fraden, Handbook of Modern Sensors, Interface Electronic Circuits (Bridge Circuits); Kitchin & Counts, A Designer's Guide to Instrumentation Amplifiers"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-007
  objetivo: O2
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    O ganho do INA128 é G = 1 + 50 kΩ/R_G. Que resistor R_G dá ganho 200? Responda em Ω, arredondado para o inteiro mais próximo.
  resposta: {valor: 251, unidade: "Ω", tolerancia: 0.01}
  explicacao: |
    R_G = 50 kΩ/(G − 1) = 50 000/199 ≈ 251,3 Ω. Na série E96, 249 Ω dá G ≈ 201,8, e 255 Ω dá G ≈ 197,1. O erro de ganho que sobra é corrigido na calibração de dois pontos do T06.
  fonte: "Texas Instruments, INA128 datasheet (equação de ganho); Kitchin & Counts, A Designer's Guide to Instrumentation Amplifiers"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-008
  objetivo: O2
  tipo: numerica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Uma célula de carga de 1 mV/V é excitada com 3,3 V. O sinal vai a um INA333 (G = 1 + 100 kΩ/R_G) com R_G = 499 Ω e o pino REF em 1,65 V, e a saída do INA vai a um ADC de 12 bits com referência de 3,3 V. Com 60 % da carga nominal (sinal positivo), que código o ADC lê? Responda com o código inteiro mais próximo.
  resposta: {valor: 2543, unidade: "código", tolerancia: 0.001}
  explicacao: |
    G = 1 + 100 000/499 ≈ 201,4. Sinal = 0,6 × 1 mV/V × 3,3 V = 1,98 mV; × 201,4 ≈ 0,3988 V acima do REF, ou seja, 2,0488 V. Código = 2,0488/3,3 × 4096 ≈ 2543. Na carga nominal, a saída sairia 0,665 V do centro: o ganho poderia dobrar e ainda caberia no ADC.
  fonte: "Texas Instruments, INA333 datasheet (equação de ganho e pino REF); Kitchin & Counts, A Designer's Guide to Instrumentation Amplifiers"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-009
  objetivo: O3
  tipo: unica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um sensor de temperatura captura um zumbido de 60 Hz da rede e é amostrado a 50 amostras/s, sem filtro anti-aliasing. Em que frequência o zumbido aparece nas amostras?
  alternativas:
    - "60 Hz, porque a frequência não muda"
    - "110 Hz"
    - "10 Hz"
    - "Não aparece, porque 60 Hz está acima de f_s/2 e é descartado"
  resposta: 2
  explicacao: |
    Acima de f_s/2 = 25 Hz, a componente rebate: 60 − 50 = 10 Hz. Nas amostras, ela é indistinguível de uma variação real de 10 Hz, e nenhum filtro digital consegue separá-la depois. Não há descarte automático: é justamente o aliasing.
  fonte: "Microchip, AN699 Anti-Aliasing, Analog Filters for Data Acquisition Systems"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-010
  objetivo: O3
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    O capacitor de amostragem de um ADC SAR de 12 bits vale 10 pF. No pior caso (capacitor de amostragem descarregado), qual é o menor capacitor externo no pino que mantém a queda de tensão no momento da amostragem abaixo de ½ LSB, pela regra C ≥ C_S·2^(N+1)? Responda em nF, com 1 casa decimal.
  resposta: {valor: 81.9, unidade: "nF", tolerancia: 0.01}
  explicacao: |
    C ≥ 10 pF × 2¹³ = 81,92 nF; na prática, 100 nF. O capacitor serve de reservatório de carga para o capacitor de amostragem, mas o resistor em série precisa recarregá-lo entre amostras (R·C bem menor que o período de amostragem).
  fonte: "Microchip, ATmega328P datasheet, Analog Input Circuitry; Microchip, AN699 Anti-Aliasing, Analog Filters for Data Acquisition Systems"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-011
  objetivo: O3
  tipo: multipla
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Um NTC num divisor (Thévenin de 5 kΩ) tem 100 nF no pino do ADC e precisa entregar uma leitura a cada 100 ms numa oficina com muito ruído de 60 Hz. Quais estratégias resolvem o problema do aliasing?
  alternativas:
    - "Amostrar a 1 kHz e entregar a média de 50 amostras (50 ms), que tem um nulo em 60 Hz"
    - "Amostrar a 10 Hz e aplicar um IIR forte no firmware, que remove o alias"
    - "Aumentar o RC para colocar o polo bem abaixo de 5 Hz, aceitando a resposta mais lenta e conferindo que o RC ainda recarrega o capacitor de amostragem"
    - "Usar só o RC atual de 318 Hz, que já atenua bem o 60 Hz"
  resposta: [0, 2]
  explicacao: |
    Sobreamostrar e fazer a média sobre um número inteiro de ciclos de 60 Hz coloca um nulo na frequência da rede. Um polo analógico bem abaixo de f_s/2 também resolve, se a lentidão for aceitável. Um filtro digital depois de amostrar a 10 Hz não ajuda, porque o alias já está na faixa útil. O RC de 318 Hz atenua o 60 Hz para cerca de 98 %, quase nada.
  fonte: "Microchip, AN699 Anti-Aliasing, Analog Filters for Data Acquisition Systems; Smith, The Scientist and Engineer's Guide to Digital Signal Processing, Moving Average Filters"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-012
  objetivo: O4
  tipo: unica
  dificuldade: 1
  bloom: entender
  enunciado: |
    Um sensor ultrassônico dá leituras boas, mas, de vez em quando, uma leitura isolada absurda. Qual filtro remove esses picos isolados sem borrar as mudanças bruscas reais?
  alternativas:
    - "Média móvel de 16 amostras"
    - "IIR de primeira ordem com α = 1/16"
    - "Filtro RC analógico na saída digital do sensor"
    - "Mediana de 5 amostras"
  resposta: 3
  explicacao: |
    A mediana descarta valores extremos isolados e deixa passar um degrau inteiro, com só 2 amostras de atraso numa janela de 5. A média e o IIR espalham o pico pelas amostras vizinhas e arredondam o degrau. O sinal do sensor já é digital, então um RC não faz sentido ali.
  fonte: "Smith, The Scientist and Engineer's Guide to Digital Signal Processing, Moving Average Filters (comparação com filtros não lineares)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-013
  objetivo: O4
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um filtro IIR de primeira ordem y[n] = y[n−1] + α·(x[n] − y[n−1]) deve imitar um RC com frequência de corte de 0,5 Hz, com amostragem a 20 Hz. Usando α = 1 − e^(−2π·f_c·T_s), qual é o valor de α? Responda com 3 casas decimais.
  resposta: {valor: 0.145, unidade: "adimensional", tolerancia: 0.01}
  explicacao: |
    T_s = 0,05 s; 2π × 0,5 × 0,05 = 0,1571; α = 1 − e^(−0,1571) ≈ 0,145. A aproximação α ≈ 2π·f_c·T_s daria 0,157, um erro de 8 % que cresce quando f_c se aproxima de f_s.
  fonte: "Smith, The Scientist and Engineer's Guide to Digital Signal Processing, Recursive Filters (Single Pole Recursive Filters)"
  origem: ia
  revisao: rascunho

- id: Q-M1.8.T05-014
  objetivo: O4
  tipo: numerica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Uma média móvel de N pontos amostrada a f_s tem nulos em f_s/N e nos seus múltiplos. Com f_s = 1200 Hz, qual é o menor N que rejeita ao mesmo tempo 50 Hz e 60 Hz? Responda com um número inteiro.
  resposta: {valor: 120, unidade: "amostras", tolerancia: 0.001}
  explicacao: |
    50 e 60 precisam ser múltiplos de 1200/N. O maior divisor comum de 50 e 60 é 10, então 1200/N = 10 e N = 120 (100 ms de janela). Com N = 24, só o 50 Hz é rejeitado; com N = 20, só o 60 Hz.
  fonte: "Smith, The Scientist and Engineer's Guide to Digital Signal Processing, Moving Average Filters (Frequency Response)"
  origem: ia
  revisao: rascunho
