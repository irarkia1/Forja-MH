- id: Q-M1.11.T03-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    No STM32L4, qual modo mantém a SRAM e os registradores, consome da ordem de 1 µA e, ao acordar, continua o programa na instrução seguinte ao WFI?
  alternativas:
    - "Sleep"
    - "Stop 2"
    - "Standby"
    - "Shutdown"
  resposta: 1
  explicacao: |
    O Stop 2 retém a SRAM e os registradores e consome ~1,1 µA (1,4 µA com o RTC) no STM32L476; acorda em µs. O Sleep só para a CPU e consome muito mais; Standby e Shutdown consomem menos, mas acordar é um reset.
  fonte: "STMicroelectronics, AN4621 (STM32L4 and STM32L4+ ultra-low-power features overview); STM32L476 datasheet"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-002
  objetivo: O1
  tipo: vf
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Verdadeiro ou falso: um nRF52840 em System OFF pode ser acordado pelo RTC a cada 10 minutos.
  resposta: false
  explicacao: |
    No System OFF o RTC está desligado. Só acordam o mecanismo DETECT dos pinos (campo SENSE), o comparador LPCOMP, o campo de NFC e o reset. Para despertar periódico, use o System ON com o RTC, que consome alguns µA.
  fonte: "Nordic Semiconductor, nRF52840 Product Specification, POWER (System OFF mode)"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-003
  objetivo: O1
  tipo: multipla
  dificuldade: 2
  bloom: entender
  enunciado: |
    Comparando o deep sleep do ESP32 com o Stop 2 do STM32L4, quais afirmações estão corretas?
  alternativas:
    - "Ao sair do deep sleep, o ESP32 reinicia e passa pelo bootloader; o STM32 continua após o WFI"
    - "O STM32L4 em Stop 2 com RTC consome cerca de dez vezes menos que o ESP32 em deep sleep"
    - "Os dois perdem toda a RAM e só guardam os registradores de backup"
    - "Acordar o STM32 do Stop 2 leva microssegundos; acordar o ESP32 do deep sleep leva dezenas a centenas de milissegundos"
  resposta: [0, 1, 3]
  explicacao: |
    O Stop 2 retém a SRAM (~1,4 µA com RTC) e acorda em µs. O deep sleep do ESP32 (~10 µA) desliga a SRAM principal, reinicia e só preserva a memória RTC. Para um sensor que acorda muitas vezes por pouco tempo, o custo de acordar decide.
  fonte: "STMicroelectronics, AN4621; Espressif, ESP-IDF Programming Guide, Sleep Modes"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-004
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Um ESP32 dorme em deep sleep a 10 µA e acorda a cada 2 s só para ler um sensor; cada despertar (boot, leitura, volta ao sono) dura 150 ms a 35 mA. Qual é a corrente média? Responda em mA, com 2 casas decimais.
  resposta: {valor: 2.63, unidade: "mA", tolerancia: 0.01}
  explicacao: |
    (0,15 × 35 + 1,85 × 0,010) / 2 = (5,25 + 0,0185) / 2 ≈ 2,63 mA. O boot domina; um MCU que sai do sono em µs (STM32 em Stop 2) ou o coprocessador ULP faria a mesma leitura por uma fração disso.
  fonte: "Espressif, ESP-IDF Programming Guide, Sleep Modes; STMicroelectronics, AN4621"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-005
  objetivo: O2
  tipo: unica
  dificuldade: 2
  bloom: entender
  enunciado: |
    No Cortex-M de um STM32L4, que papel tem o bit SLEEPDEEP do registrador SCB->SCR?
  alternativas:
    - "Faz o WFI entrar no modo profundo escolhido em PWR_CR1.LPMS em vez do Sleep comum"
    - "Desliga o watchdog independente durante o sono"
    - "Escolhe se o despertar será por evento ou por interrupção"
    - "Liga a retenção da SRAM2 no Standby"
  resposta: 0
  explicacao: |
    Com SLEEPDEEP = 0, o WFI leva ao Sleep (só a CPU para). Com SLEEPDEEP = 1, o chip entra no modo definido em LPMS: Stop 0, 1, 2, Standby ou Shutdown. A retenção da SRAM2 é o bit RRS do PWR_CR3; o IWDG não pode ser desligado depois de ligado.
  fonte: "STMicroelectronics, RM0351, Power control (PWR), Low-power modes"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-006
  objetivo: O2
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    O timer de wake-up do RTC de um STM32L4 está configurado com WUCKSEL para ck_spre = 1 Hz (LSE de 32,768 kHz, prescalers de reset). Que valor deve ser escrito em RTC_WUTR para acordar a cada 15 minutos? Responda como número inteiro, sem unidade de tempo.
  resposta: {valor: 899, unidade: "contagens", tolerancia: 0}
  explicacao: |
    Com WUCKSEL = 10x, o período é (WUTR + 1) ciclos de ck_spre. 15 min = 900 s → WUTR = 899.
  fonte: "STMicroelectronics, RM0351, Real-time clock (RTC), Periodic auto-wakeup"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-007
  objetivo: O2
  tipo: unica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Um STM32L4 rodando a 80 MHz pelo PLL entra em Stop 2 e acorda pelo RTC. Depois disso, a UART passa a mandar lixo e os atrasos ficam errados. Qual é a causa mais provável?
  alternativas:
    - "A SRAM foi apagada no Stop 2 e as variáveis da UART se perderam"
    - "O RTC desligou o LSE ao gerar o evento de wake-up"
    - "O sistema acordou no MSI (ou HSI16) com o PLL desligado, e o firmware não reconfigurou o clock"
    - "A linha 20 da EXTI ficou pendente e trava a UART"
  resposta: 2
  explicacao: |
    No Stop, os osciladores de alta frequência e o PLL param. O chip acorda com o MSI ou o HSI16 (bit STOPWUCK), e periféricos configurados para 80 MHz passam a funcionar em outra frequência. A SRAM é retida no Stop 2.
  fonte: "STMicroelectronics, RM0351, Reset and clock control (RCC) (STOPWUCK) e Power control (PWR)"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-008
  objetivo: O3
  tipo: vf
  dificuldade: 1
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: um pino sem uso configurado como entrada digital e deixado flutuando não consome nada, porque a entrada CMOS tem impedância altíssima.
  resposta: false
  explicacao: |
    Com a tensão flutuando perto do meio da faixa, os dois transistores do buffer de entrada conduzem parcialmente e circula corrente, de µA a centenas de µA, variando com o ambiente. Pinos sem uso vão para o modo analógico (STM32), recebem pull-up ou ficam como saída.
  fonte: "STMicroelectronics, AN4621; Microchip, ATmega328P datasheet, Minimizing Power Consumption"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-009
  objetivo: O3
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um contato normalmente fechado liga um pino ao GND, com pull-up de 22 kΩ para 3,0 V. Quanto ele consome em repouso? Responda em µA, arredondando para o inteiro mais próximo.
  resposta: {valor: 136, unidade: "µA", tolerancia: 0.01}
  explicacao: |
    I = 3,0 / 22 kΩ ≈ 136 µA, o tempo todo em que o contato estiver fechado. É dezenas de vezes o sono do MCU: inverta a lógica do contato, use pull-up de valor alto ou desligue o pull-up enquanto o contato está fechado.
  fonte: "Microchip, ATmega328P datasheet, Minimizing Power Consumption"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-010
  objetivo: O3
  tipo: multipla
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Um sensor I²C é alimentado por um trilho que o MCU corta durante o sono, mas a corrente de sono continua centenas de µA acima do esperado. Quais medidas evitam a alimentação reversa do sensor pelos pinos?
  alternativas:
    - "Aumentar a frequência do I²C para 1 MHz para o sensor terminar mais depressa"
    - "Trocar os pull-ups de 4,7 kΩ por 1 kΩ para firmar o nível alto"
    - "Ligar os pull-ups do SDA e do SCL ao trilho chaveado, e não ao 3,3 V permanente"
    - "Pôr os pinos SDA e SCL do MCU em modo analógico (ou em nível baixo) antes de cortar o sensor"
  resposta: [2, 3]
  explicacao: |
    Com o VDD do sensor em zero e as linhas em nível alto, a corrente entra pelos diodos de proteção dos pinos do sensor e o alimenta pela metade. Os pull-ups no trilho chaveado e os pinos do MCU sem forçar nível alto eliminam o caminho. Pull-ups menores só pioram a fuga.
  fonte: "Texas Instruments, IQ: What it is, what it isn't, and how to use it; Nordic Semiconductor, nRF52840 Product Specification, GPIO"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-011
  objetivo: O3
  tipo: numerica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Um sensor de porta com CR2032 (225 mAh) tem corrente média de 8 µA. Um reed switch fechado com a porta fechada fica sobre um pull-up de 100 kΩ para 3,0 V, e a porta passa 75 % do tempo fechada. Qual é a autonomia, contando essa fuga? Responda em dias, arredondando para o inteiro mais próximo.
  resposta: {valor: 307, unidade: "dias", tolerancia: 0.01}
  explicacao: |
    Fuga com o contato fechado: 3,0 / 100 kΩ = 30 µA; média: 0,75 × 30 = 22,5 µA. Total: 8 + 22,5 = 30,5 µA. Autonomia: 225 / 0,0305 ≈ 7377 h ≈ 307 dias, contra ~1172 dias sem a fuga. Um ímã que abre o contato com a porta fechada resolve.
  fonte: "Microchip, ATmega328P datasheet, Minimizing Power Consumption; Energizer, CR2032 Product Datasheet"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-012
  objetivo: O4
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um nó tem carga de sono de 2,4 µA (MCU, sensor e rádio dormindo) e usa um LDO com corrente quiescente de 1,6 µA. Qual é a corrente de sono tirada da bateria? Responda em µA, com 1 casa decimal.
  resposta: {valor: 4.0, unidade: "µA", tolerancia: 0.01}
  explicacao: |
    No LDO, a corrente de entrada é a de saída mais o Iq: 2,4 + 1,6 = 4,0 µA. O regulador responde por 40 % do sono; um LDO de Iq de dezenas de nA quase eliminaria essa parcela.
  fonte: "Microchip, MCP1700 datasheet; Texas Instruments, TPS7A02 datasheet"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-013
  objetivo: O4
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Um buck de nanopotência com Iq de 0,36 µA alimenta a 1,8 V uma carga de sono de 4 µA, a partir de uma bateria de 3,0 V. Nessa carga, a eficiência é 80 %. Qual é a corrente de sono na bateria, incluindo o Iq? Responda em µA, com 2 casas decimais.
  resposta: {valor: 3.36, unidade: "µA", tolerancia: 0.01}
  explicacao: |
    I = V_out·I_out / (η·V_bat) + Iq = 1,8 × 4 / (0,8 × 3,0) + 0,36 = 3,00 + 0,36 = 3,36 µA. Com um LDO seria 4 µA mais o Iq dele: o buck ganha porque a tensão de saída é bem menor que a da bateria e a carga não depende da tensão.
  fonte: "Texas Instruments, TPS62740 datasheet (curvas de eficiência em carga de µA)"
  origem: ia
  revisao: rascunho

- id: Q-M1.11.T03-014
  objetivo: O4
  tipo: unica
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Um sensor de gás consome 300 µA em espera (não tem modo de sono) e só é lido a cada 10 min por 2 s. O resto do nó dorme a 3 µA. Qual arquitetura de alimentação é a mais adequada?
  alternativas:
    - "Manter o sensor ligado e trocar o LDO por um de Iq menor"
    - "Alimentar o sensor pelo mesmo trilho permanente e pôr o MCU em Shutdown"
    - "Aumentar a capacidade da bateria para compensar os 300 µA"
    - "Pôr o sensor num trilho cortado por uma chave de carga, com os pull-ups do barramento nesse trilho, ligando-o só durante a leitura (mais o tempo de aquecimento)"
  resposta: 3
  explicacao: |
    Os 300 µA contínuos são cem vezes o resto do sono; nenhum regulador ou modo do MCU compensa isso. A chave de carga corta o sensor fora da leitura; os pull-ups no trilho chaveado evitam a alimentação reversa. O tempo de aquecimento do sensor entra no orçamento como estado ativo.
  fonte: "Texas Instruments, IQ: What it is, what it isn't, and how to use it; STMicroelectronics, AN4621"
  origem: ia
  revisao: rascunho
