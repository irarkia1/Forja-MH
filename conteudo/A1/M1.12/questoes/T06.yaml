  origem: ia
  revisao: rascunho

- id: Q-M1.12.T06-010
  objetivo: O3
  tipo: vf
  dificuldade: 2
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: a demonstração do alerta deve ser gravada numa tomada contínua, do aquecimento do sensor até a notificação no celular, com um relógio visível na tela.
  resposta: true
  explicacao: |
    O requisito é de tempo. Um corte entre o estímulo e a notificação pode esconder qualquer espera; com a tomada contínua e o relógio, quem assiste mede a latência sozinho.
  fonte: "Roteiro M1.12.T06 (regras de gravação)"
  origem: ia
  revisao: rascunho

- id: Q-M1.12.T06-011
  objetivo: O3
  tipo: multipla
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Você tem 4 minutos de vídeo. Quais cenas ajudam a provar os requisitos principais do projeto?
  alternativas:
    - "O alerta ao vivo, do aquecimento à notificação, com relógio na tela"
    - "O perfil de corrente de um envio no medidor e a tabela de autonomia antes e depois das otimizações"
    - "A leitura comentada de todo o main.c, linha por linha"
    - "O que deu errado no projeto e a principal limitação"
  resposta: [0, 1, 3]
  explicacao: |
    A demonstração prova o alerta e a latência; o perfil e a tabela provam a autonomia medida; a limitação e a lição mostram maturidade técnica. Ler o código inteiro consome o vídeo sem provar requisito: o código está no repositório.
  fonte: "Roteiro M1.12.T06 (roteiro do vídeo)"
  origem: ia
  revisao: rascunho

- id: Q-M1.12.T06-012
  objetivo: O4
  tipo: unica
  dificuldade: 2
  bloom: avaliar
  enunciado: |
    No relatório de aceite, a verificação do RNF-01 (erro ≤ ±0,5 °C) deu erro medido de 0,42 °C, com incerteza de 0,15 °C. Qual situação registrar?
  alternativas:
    - "Atende"
    - "Não atende"
    - "Inconclusivo"
    - "Não verificado"
  resposta: 2
  explicacao: |
    O erro somado à incerteza (0,57 °C) passa do limite, e o erro sozinho está dentro: não dá para afirmar nem que atende nem que não atende. Registra-se inconclusivo, com a evidência e o plano para melhorar a verificação.
  fonte: "Roteiro M1.12.T02 (calibração e incerteza); roteiro M1.12.T06 (relatório de aceite)"
  origem: ia
  revisao: rascunho

- id: Q-M1.12.T06-013
  objetivo: O4
  tipo: unica
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Numa entrevista pedem: "conte uma decisão técnica que você mudou depois de medir". Qual resposta segue melhor o método STAR?
  alternativas:
    - "Usei ESP32 porque é o melhor microcontrolador para IoT e tem Wi-Fi"
    - "A autonomia medida dava 178 dias e o requisito era 183. Precisava achar o que dominava. Medi cada vigília, vi que o envio era 76 % da carga e apliquei conexão rápida, uma mudança por vez. Fui para 268 dias, conferindo latência e entrega"
    - "Mudei muitas coisas no firmware até a bateria durar mais, e no fim deu certo"
    - "Não mudei nenhuma decisão, porque planejei tudo direito no começo"
  resposta: 1
  explicacao: |
    STAR é Situação (178 contra 183 dias), Tarefa (achar o que dominava), Ação (medir, otimizar uma coisa por vez) e Resultado (268 dias, com os outros requisitos conferidos). As outras respostas não têm número, método ou decisão.
  fonte: "Roteiro M1.12.T06 (portfólio e entrevista); roteiro M1.12.T05"
  origem: ia
  revisao: rascunho

- id: Q-M1.12.T06-014
  objetivo: O4
  tipo: unica
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Faltam dois dias para publicar o projeto. O ensaio do RNF-03 deu 18 de 20 alertas em até 60 s (o critério é 19 de 20); os dois lentos chegaram 4 min depois, logo após outro alerta da mesma estação. Todos os outros requisitos passaram. O que deve ir para o relatório de aceite e para o README?
  alternativas:
    - "RNF-03 como atende, porque 90 % é quase o critério e os casos lentos são raros"
    - "Retirar o RNF-03 do relatório e do README até haver tempo de investigar"
    - "RNF-03 como atende, citando só a mediana da latência"
    - "RNF-03 como não atende, com a evidência, a causa provável (o agrupamento da política de notificação segura alertas repetidos da mesma estação) e o plano de correção; o README mostra o resultado real na tabela e nas limitações"
  resposta: 3
  explicacao: |
    Um "não atende" bem explicado preserva a confiança em todos os outros números. O padrão "logo após outro alerta da mesma estação" aponta para o group interval da política de notificação, o que dá uma causa provável e um plano. Arredondar, omitir ou trocar a estatística é o que um avaliador experiente percebe.
  fonte: "Roteiro M1.12.T06 (relatório de aceite); Grafana Labs, Grafana Alerting (Notification policies: group interval)"
  origem: ia
  revisao: rascunho
