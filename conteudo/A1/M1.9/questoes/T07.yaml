- id: Q-M1.9.T07-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Qual é a taxa de dados nominal do PHY O-QPSK de 2,4 GHz do IEEE 802.15.4, usado pelo Zigbee e pelo Thread?
  alternativas:
    - "1 Mbit/s"
    - "250 kbit/s"
    - "54 Mbit/s"
    - "20 kbit/s"
  resposta: 1
  explicacao: |
    O PHY de 2,4 GHz usa O-QPSK com espalhamento, 62,5 ksímbolos/s e 4 bits por símbolo: 250 kbit/s. 20 kbit/s é a taxa original da faixa de 868 MHz; 1 Mbit/s é o LE 1M do BLE; 54 Mbit/s é o 802.11g.
  fonte: "IEEE 802.15.4, O-QPSK PHY; Silicon Labs, UG103.2 Zigbee Fundamentals"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-002
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Qual é a frequência central do canal 20 do IEEE 802.15.4 em 2,4 GHz? Responda em MHz, com um número inteiro.
  resposta: {valor: 2450, unidade: "MHz", tolerancia: 0}
  explicacao: |
    f = 2405 + 5 × (k − 11) = 2405 + 5 × 9 = 2450 MHz. Fica entre os canais Wi-Fi 6 (2437 MHz) e 11 (2462 MHz), numa região de menor interferência.
  fonte: "IEEE 802.15.4, Channel assignments; Silicon Labs, AN1138 Zigbee Mesh Network Performance"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-003
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Quanto tempo leva no ar um quadro 802.15.4 de tamanho máximo (127 bytes de PSDU) mais os 6 bytes de preâmbulo, SFD e cabeçalho do PHY, a 250 kbit/s? Responda em ms, com 3 casas decimais.
  resposta: {valor: 4.256, unidade: "ms", tolerancia: 0.01}
  explicacao: |
    A 250 kbit/s, cada byte leva 32 µs. (127 + 6) × 32 µs = 4256 µs = 4,256 ms. Recuo, ACK e cabeçalhos de rede reduzem a vazão útil a dezenas de kbit/s.
  fonte: "IEEE 802.15.4, PPDU format e MAC constants and PIB attributes (aMaxPHYPacketSize)"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-004
  objetivo: O1
  tipo: vf
  dificuldade: 2
  bloom: analisar
  enunciado: |
    Verdadeiro ou falso: o canal 11 do 802.15.4 é uma boa escolha numa casa cujo roteador Wi-Fi opera no canal 1, porque os dois padrões numeram os canais de forma independente e não interferem.
  resposta: false
  explicacao: |
    A numeração é independente, mas o espectro é o mesmo. O canal 802.15.4 11 fica em 2405 MHz, dentro da faixa ocupada pelo Wi-Fi do canal 1 (2412 MHz ± 10 MHz). Canais como 15, 20, 25 e 26 caem entre os canais Wi-Fi 1, 6 e 11.
  fonte: "IEEE 802.15.4, Channel assignments; Silicon Labs, AN1138 Zigbee Mesh Network Performance"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-005
  objetivo: O2
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    No Thread, qual tipo de nó é um dispositivo final que pode ser promovido automaticamente a roteador quando a rede precisa de mais cobertura?
  alternativas:
    - "SED (Sleepy End Device)"
    - "Líder"
    - "Border Router"
    - "REED (Router-Eligible End Device)"
  resposta: 3
  explicacao: |
    O REED opera como filho, mas pode virar roteador (e voltar) conforme a rede precisa. O SED dorme e nunca roteia; o líder é um roteador eleito; o border router liga a malha à rede IP externa.
  fonte: "Thread Group, Thread Network Fundamentals, Node Roles and Types; openthread.io, Thread Primer, Node Roles and Types"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-006
  objetivo: O2
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um sensor Thread sonolento (SED) consulta o pai a cada 2 s; cada consulta dura 3 ms a 18 mA, e dormindo ele consome 2 µA. Qual é a corrente média? Responda em µA, com um número inteiro.
  resposta: {valor: 29, unidade: "µA", tolerancia: 0.01}
  explicacao: |
    Carga por consulta = 18 mA × 3 ms = 54 µC; por segundo, 54 / 2 = 27 µA. Total = 2 + 27 = 29 µA. Consultar menos economiza energia e aumenta a latência dos comandos para o sensor.
  fonte: "Thread Group, Thread Network Fundamentals, Node Roles and Types (Sleepy End Device); Silicon Labs, UG103.11 Thread Fundamentals"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-007
  objetivo: O2
  tipo: multipla
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Marque as afirmações corretas sobre o Zigbee.
  alternativas:
    - "Dispositivos finais a bateria falam só com o seu pai e consultam o pai para buscar mensagens guardadas"
    - "A Zigbee Cluster Library define clusters padronizados, como On/Off e Temperature Measurement, que permitem interoperar aparelhos de fabricantes diferentes"
    - "Cada nó Zigbee tem endereço IPv6 global e pode ser alcançado diretamente da internet"
    - "Install codes impressos no aparelho permitem derivar uma chave de enlace única e evitam depender da chave de enlace padrão pública"
  resposta: [0, 1, 3]
  explicacao: |
    ZEDs dependem do pai e fazem polling; a ZCL é a camada de interoperabilidade; install codes fecham a fraqueza da chave de enlace conhecida. O Zigbee tem rede própria, sem IP; quem usa IPv6 sobre 802.15.4 é o Thread.
  fonte: "Connectivity Standards Alliance, Zigbee Specification (Network Device Types, Security Services); Zigbee Cluster Library Specification; Silicon Labs, UG103.2 Zigbee Fundamentals"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-008
  objetivo: O2
  tipo: unica
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Numa casa com Zigbee, os sensores de porta passam a falhar sempre que o morador desliga no interruptor de parede a lâmpada inteligente do corredor. Qual é o diagnóstico e a correção de projeto?
  alternativas:
    - "A lâmpada era roteador e pai dos sensores; a malha deve se apoiar em roteadores sempre energizados (tomadas inteligentes, o próprio hub) ou o interruptor deve ser trocado por um comando inteligente"
    - "A lâmpada gerava interferência no canal; basta trocar o canal da rede"
    - "Os sensores estão com a chave de rede errada; é preciso refazer o pareamento"
    - "O coordenador perde o papel de Trust Center quando qualquer nó é desligado"
  resposta: 0
  explicacao: |
    Lâmpadas inteligentes ligadas à rede elétrica costumam atuar como roteadores Zigbee. Cortada a energia, os dispositivos finais filhos perdem o pai e precisam se reassociar, se houver outro roteador ao alcance. A malha deve ter roteadores sempre alimentados.
  fonte: "Connectivity Standards Alliance, Zigbee Specification, Network Device Types; Silicon Labs, UG103.2 Zigbee Fundamentals"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-009
  objetivo: O3
  tipo: unica
  dificuldade: 2
  bloom: entender
  enunciado: |
    Sobre quais transportes um aparelho Matter troca dados na operação normal?
  alternativas:
    - "Zigbee e Z-Wave"
    - "Somente BLE"
    - "IPv6 sobre Wi-Fi, Thread ou Ethernet"
    - "LoRaWAN e NB-IoT"
  resposta: 2
  explicacao: |
    O Matter é uma camada de aplicação sobre IPv6, com transportes Wi-Fi, Thread e Ethernet. O BLE é usado só no comissionamento. Aparelhos Zigbee e Z-Wave podem entrar via bridge.
  fonte: "Connectivity Standards Alliance, Matter Core Specification, Architecture Overview; Google Home Developers, Matter Primer"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-010
  objetivo: O3
  tipo: multipla
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Marque as afirmações corretas sobre o Matter.
  alternativas:
    - "Cada unidade certificada carrega um DAC (Device Attestation Certificate) próprio, encadeado a um PAI do fabricante e a um PAA confiável"
    - "Um aparelho pode pertencer a vários fabrics ao mesmo tempo, aparecendo em ecossistemas diferentes"
    - "O comando de uma lâmpada Matter precisa passar pela nuvem do fabricante a cada acionamento"
    - "O código de configuração (QR code ou código manual) permite ao celular abrir uma sessão PASE com o aparelho no comissionamento"
  resposta: [0, 1, 3]
  explicacao: |
    Atestação (PAA → PAI → DAC), multiadministração por fabrics e comissionamento com PASE a partir do passcode são pilares do Matter. A operação é local, sobre IPv6, com sessões CASE; a nuvem não é obrigatória.
  fonte: "Connectivity Standards Alliance, Matter Core Specification, Device Attestation e Commissioning; Google Home Developers, Matter Primer (Fabrics, Commissioning)"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-011
  objetivo: O3
  tipo: vf
  dificuldade: 1
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: o Matter é um novo rádio de 2,4 GHz que substitui o 802.15.4 e o Wi-Fi.
  resposta: false
  explicacao: |
    O Matter não define rádio nem malha: é um padrão de aplicação (modelo de dados, comissionamento, segurança) que roda sobre IPv6 em redes Thread, Wi-Fi e Ethernet.
  fonte: "Connectivity Standards Alliance, Matter Core Specification, Architecture Overview"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-012
  objetivo: O4
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um ESP32 precisa enviar um bloco de configuração de 4096 bytes a outro por ESP-NOW v1, com no máximo 250 bytes de dados por quadro e sem cabeçalho próprio. Quantos quadros, no mínimo, serão enviados? Responda com um número inteiro de quadros.
  resposta: {valor: 17, unidade: "quadros", tolerancia: 0}
  explicacao: |
    ⌈4096 / 250⌉ = ⌈16,38⌉ = 17 quadros. Na prática, cada quadro leva também um cabeçalho de aplicação (sequência, deslocamento), o que reduz a carga útil por quadro.
  fonte: "ESP-IDF Programming Guide, API Reference, Networking APIs, ESP-NOW (Frame Format, Send and Receive ESP-NOW Data)"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-013
  objetivo: O4
  tipo: multipla
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Marque as afirmações corretas sobre o ESP-NOW no ESP-IDF.
  alternativas:
    - "Os dois aparelhos precisam estar no mesmo canal de Wi-Fi, e conectar um deles a um roteador muda o seu canal para o do roteador"
    - "ESP_NOW_SEND_SUCCESS no callback de envio confirma que a aplicação do receptor processou e gravou a mensagem"
    - "Os callbacks de envio e recepção rodam na tarefa do Wi-Fi e devem apenas repassar os dados, por exemplo para uma fila"
    - "Pares podem ser cifrados com PMK e LMK, e um número de sequência na mensagem ajuda a detectar repetição de quadros gravados"
  resposta: [0, 2, 3]
  explicacao: |
    Canal comum é obrigatório. O sucesso de envio é o ACK da camada MAC, não confirmação de aplicação. Callbacks devem ser curtos. A cifra CCMP com PMK/LMK protege o conteúdo, mas replay se detecta com sequência verificada no receptor.
  fonte: "ESP-IDF Programming Guide, API Reference, Networking APIs, ESP-NOW (Security, Send and Receive ESP-NOW Data)"
  origem: ia
  revisao: rascunho

- id: Q-M1.9.T07-014
  objetivo: O4
  tipo: unica
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Uma empresa vai lançar um sensor de porta a bateria para casas, que deve funcionar com Apple Home, Google Home e Alexa sem hub próprio. Qual escolha de rede atende melhor?
  alternativas:
    - "ESP-NOW com um gateway ESP32 próprio ligado ao Wi-Fi"
    - "Matter sobre Thread, usando os border routers que esses ecossistemas já instalam"
    - "Zigbee 3.0 sem hub, falando direto com os celulares"
    - "Wi-Fi sempre conectado com WIFI_PS_NONE"
  resposta: 1
  explicacao: |
    Matter é o padrão de aplicação aceito pelos três ecossistemas; Thread dá malha de baixo consumo para bateria, e HomePod, Nest Hub e Echo recentes funcionam como border routers. ESP-NOW é proprietário e exige gateway; Zigbee precisa de hub e celulares não têm rádio 802.15.4; Wi-Fi sempre ligado acaba com a bateria.
  fonte: "Connectivity Standards Alliance, Matter Core Specification, Architecture Overview; Thread Group, Thread Network Fundamentals, Border Routers"
  origem: ia
  revisao: rascunho
