- id: Q-M1.3.T05-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Numa transação de leitura, quais linhas do barramento informam **qual posição** de memória ou de periférico a CPU quer ler?
  alternativas:
    - "As linhas de endereço"
    - "As linhas de dados"
    - "A linha de clock"
    - "A linha de pronto (ready), usada pelo escravo"
  resposta: 0
  explicacao: |
    O mestre põe o endereço nas linhas de endereço; o decodificador usa os bits altos para escolher o escravo, que devolve o valor pelas linhas de dados. As linhas de controle dizem se é leitura ou escrita e o tamanho; a linha de pronto permite ao escravo pedir ciclos de espera.
  fonte: "Harris & Harris, Digital Design and Computer Architecture, capítulo Embedded I/O Systems, seção Memory-Mapped I/O; ARM, AMBA 3 AHB-Lite Protocol Specification, Introduction"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-002
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um barramento AHB de 32 bits roda a 72 MHz e completa uma transferência por ciclo. Qual é a largura de banda de pico? Responda em MB/s (1 MB = 10⁶ bytes), exato.
  resposta: {valor: 288, unidade: "MB/s", tolerancia: 0}
  explicacao: |
    32 bits = 4 bytes por transferência. 4 bytes × 72·10⁶ transferências/s = 288·10⁶ B/s = 288 MB/s. É um limite teórico: wait states da flash, disputa com o DMA e transferências de 1 byte reduzem o valor real.
  fonte: "Joseph Yiu, The Definitive Guide to ARM Cortex-M3 and Cortex-M4 Processors, 3ª ed., capítulo Memory System; ARM, AMBA 3 AHB-Lite Protocol Specification"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-003
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Num STM32F103 com HCLK = 72 MHz e PCLK1 = 36 MHz, uma escrita num registrador de um periférico do APB1 leva no mínimo 2 ciclos de PCLK1 (fases de setup e de access do APB). Quantos ciclos de HCLK isso representa, no mínimo? Responda com um inteiro.
  resposta: {valor: 4, unidade: "ciclos de HCLK", tolerancia: 0}
  explicacao: |
    Um ciclo de PCLK1 a 36 MHz dura o mesmo que 2 ciclos de HCLK a 72 MHz. 2 ciclos de PCLK1 = 4 ciclos de HCLK, sem contar o atraso da ponte AHB→APB. Uma escrita na SRAM leva 1 ou 2. É por isso que alternar um pino ou escrever na UART em laço é limitado pelo barramento, não pela CPU.
  fonte: "ARM, AMBA 3 APB Protocol Specification (transferências com setup e access); ST, RM0008, capítulo Memory and bus architecture"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-004
  objetivo: O1
  tipo: vf
  dificuldade: 2
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: num STM32, tanto a CPU quanto o controlador de DMA atuam como mestres do barramento, iniciando transações, enquanto a SRAM e as pontes para os barramentos APB atuam como escravos.
  resposta: true
  explicacao: |
    O mestre inicia a transação; o escravo responde. A matriz de barramentos do STM32F103 tem como mestres o barramento System do Cortex-M3, o DCode e os DMAs, e como escravos a interface da flash, a SRAM e o AHB com as pontes APB. Quando CPU e DMA querem o mesmo escravo, o árbitro da matriz alterna o acesso.
  fonte: "ST, RM0008, capítulo Memory and bus architecture, seção System architecture"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-005
  objetivo: O2
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    No mapa de memória padrão do Cortex-M, em que endereço começa a região destinada à SRAM?
  alternativas:
    - "0x0000_0000"
    - "0x0800_0000"
    - "0x2000_0000"
    - "0x4000_0000"
  resposta: 2
  explicacao: |
    A arquitetura reserva 0x2000_0000–0x3FFF_FFFF para SRAM; os fabricantes põem a SRAM interna no começo dela. 0x0000_0000 inicia a região Code, 0x4000_0000 a região de periféricos, e 0x0800_0000 é onde a ST coloca a flash, dentro da região Code.
  fonte: "ARMv7-M Architecture Reference Manual, The system address map; Joseph Yiu, The Definitive Guide to ARM Cortex-M3 and Cortex-M4 Processors, 3ª ed., capítulo Memory System"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-006
  objetivo: O2
  tipo: multipla
  dificuldade: 2
  bloom: entender
  enunciado: |
    Sobre o mapa de memória do STM32F103, quais afirmações são corretas?
  alternativas:
    - "A flash começa em 0x0800_0000 e, quando o chip dá boot pela flash, também aparece espelhada a partir de 0x0000_0000."
    - "O NVIC e o SysTick ficam na região PPB, a partir de 0xE000_0000, nos mesmos endereços de qualquer outro Cortex-M3."
    - "Os registradores dos GPIOs ficam na região de SRAM, porque guardam dados."
    - "Os periféricos do APB2, como GPIOA e USART1, ficam a partir de 0x4001_0000."
  resposta: [0, 1, 3]
  explicacao: |
    Com BOOT0 = 0, a flash é espelhada em 0x0000_0000, de onde o núcleo lê o vetor no reset. O PPB (NVIC em 0xE000_E100, SysTick em 0xE000_E010) é parte do núcleo e igual em todo Cortex-M3. Os GPIOs são periféricos e ficam na região Peripheral, no APB2 (GPIOA em 0x4001_0800), não na região de SRAM.
  fonte: "ST, RM0008, capítulo Memory and bus architecture (Memory map, Boot configuration); ARMv7-M Architecture Reference Manual, The system address map"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-007
  objetivo: O2
  tipo: unica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Num HardFault de um STM32F103, o registrador de endereço de falha mostra 0x4001_3804. Onde fica esse endereço?
  alternativas:
    - "Na SRAM, perto do topo da pilha"
    - "Na flash, na tabela de vetores"
    - "Na região PPB, no NVIC"
    - "Na região de periféricos, no APB2, dentro da USART1 (registrador de dados)"
  resposta: 3
  explicacao: |
    0x4000_0000–0x5FFF_FFFF é a região de periféricos. 0x4001_0000 em diante é o APB2 no STM32F103, e a USART1 começa em 0x4001_3800; o deslocamento 0x04 é o registrador DR. Uma falha nesse endereço sugere, por exemplo, acesso à USART1 com o clock dela desligado ou um acesso com tamanho não suportado.
  fonte: "ST, RM0008, capítulo Memory and bus architecture (Memory map) e capítulo USART (USART register map)"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-008
  objetivo: O3
  tipo: vf
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Verdadeiro ou falso: num STM32, antes de configurar um periférico é preciso ligar o clock dele no RCC; sem isso, as escritas nos registradores do periférico não têm efeito.
  resposta: true
  explicacao: |
    Todos os periféricos começam com o clock desligado para economizar energia. Os bits de habilitação ficam nos registradores `RCC_AHBENR`, `RCC_APB1ENR` e `RCC_APB2ENR`. Esquecer essa etapa é o erro mais comum de quem programa direto nos registradores: o código parece certo e nada acontece.
  fonte: "ST, RM0008, capítulo Reset and clock control (RCC), registradores RCC_APB2ENR e RCC_APB1ENR"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-009
  objetivo: O3
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Num STM32F103, o cristal HSE de 8 MHz alimenta o PLL com multiplicador × 9. O prescaler do AHB é ÷ 1 e o do APB1 é ÷ 2. Qual é a frequência PCLK1? Responda em MHz, exato.
  resposta: {valor: 36, unidade: "MHz", tolerancia: 0}
  explicacao: |
    SYSCLK = 8 MHz × 9 = 72 MHz; HCLK = 72 ÷ 1 = 72 MHz; PCLK1 = 72 ÷ 2 = 36 MHz, que é o máximo permitido para o APB1 do STM32F103. Com APB1 ÷ 1, o barramento ficaria fora da especificação.
  fonte: "ST, RM0008, capítulo Reset and clock control (RCC), seção Clocks (clock tree)"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-010
  objetivo: O3
  tipo: numerica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Num STM32F103 com PCLK2 = 72 MHz, o ADC recebe PCLK2 dividido pelo prescaler do ADC, que pode ser 2, 4, 6 ou 8, e o clock do ADC não pode passar de 14 MHz. Qual é a maior frequência de clock do ADC possível? Responda em MHz, exato.
  resposta: {valor: 12, unidade: "MHz", tolerancia: 0}
  explicacao: |
    72 ÷ 2 = 36, 72 ÷ 4 = 18 (ambos acima de 14 MHz); 72 ÷ 6 = 12 MHz, o maior valor permitido. Por isso, com 72 MHz o ADC do F103 não alcança a taxa máxima de 1 Msps (que exige 14 MHz); para isso, a ST sugere SYSCLK de 56 MHz (56 ÷ 4 = 14).
  fonte: "ST, RM0008, capítulo Reset and clock control (RCC), seção Clocks, e capítulo Analog-to-digital converter (ADC clock)"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-011
  objetivo: O3
  tipo: numerica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Uma placa com STM32F103 não tem cristal, então o PLL precisa usar o oscilador interno HSI de 8 MHz, que entra no PLL dividido por 2. O multiplicador do PLL vai de 2 a 16. Qual é o maior SYSCLK que se consegue obter? Responda em MHz, exato.
  resposta: {valor: 64, unidade: "MHz", tolerancia: 0}
  explicacao: |
    A entrada do PLL é HSI ÷ 2 = 4 MHz. Com o multiplicador máximo (× 16): 4 × 16 = 64 MHz. Quem esquece o ÷ 2 calcula 8 × 9 = 72 MHz e configura um PLL que entrega só 36 MHz. Além disso, o HSI é menos preciso que um cristal, o que atrapalha USB e UART em baud rates altos.
  fonte: "ST, RM0008, capítulo Reset and clock control (RCC), seção Clocks (PLL e PLLSRC)"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-012
  objetivo: O4
  tipo: unica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    No STM32F103, a USART1 começa em 0x4001_3800 e os registradores são SR (0x00), DR (0x04), BRR (0x08), CR1 (0x0C). Qual é o endereço do registrador `USART1->BRR`?
  alternativas:
    - "0x4001_3802"
    - "0x4001_3808"
    - "0x4001_3880"
    - "0x4001_380C"
  resposta: 1
  explicacao: |
    Endereço = base + deslocamento = 0x4001_3800 + 0x08 = 0x4001_3808. O deslocamento já está em bytes no manual. 0x380C seria o CR1; 0x3802 conta 1 byte por registrador; 0x3880 desloca o 8 uma casa hexadecimal.
  fonte: "ST, RM0008, capítulo Universal synchronous asynchronous receiver transmitter (USART), USART register map"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-013
  objetivo: O4
  tipo: unica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    No Cortex-M3, o alias de bit-band dos periféricos é calculado por alias = 0x4200_0000 + (endereço − 0x4000_0000) × 32 + bit × 4. Qual é o endereço de alias do bit 13 do `GPIOC_ODR`, que fica em 0x4001_100C?
  alternativas:
    - "0x4222_01B4"
    - "0x4201_100C"
    - "0x4222_0180"
    - "0x4022_01B4"
  resposta: 0
  explicacao: |
    Deslocamento = 0x1_100C. × 32 = 0x22_0180. Bit 13 × 4 = 52 = 0x34. Alias = 0x4200_0000 + 0x22_0180 + 0x34 = 0x4222_01B4. 0x4222_0180 é o alias do bit 0 (esqueceu o termo do bit); 0x4022_01B4 usou a base errada. Escrever 1 nesse alias liga PC13 numa única transação de barramento.
  fonte: "Joseph Yiu, The Definitive Guide to ARM Cortex-M3 and Cortex-M4 Processors, 3ª ed., capítulo Memory System, seção Bit-band operations; ST, RM0008, seção Bit banding"
  origem: ia
  revisao: rascunho

- id: Q-M1.3.T05-014
  objetivo: O4
  tipo: unica
  dificuldade: 4
  bloom: analisar
  enunciado: |
    Ao ler um código antigo de Cortex-M3, você encontra `*(volatile uint32_t *)0x22000A08 = 1;`. Sabendo que o alias de bit-band da SRAM é 0x2200_0000 + (endereço − 0x2000_0000) × 32 + bit × 4, qual bit de qual byte da SRAM essa linha liga?
  alternativas:
    - "Bit 8 do byte em 0x2000_0A08"
    - "Bit 2 do byte em 0x2000_0050"
    - "Bit 0 do byte em 0x2000_0051"
    - "Bit 4 do byte em 0x2000_0050"
  resposta: 1
  explicacao: |
    Deslocamento no alias = 0xA08 = 2568. Cada byte ocupa 32 bytes de alias: 2568 ÷ 32 = 80 com resto 8. Byte = 0x2000_0000 + 80 = 0x2000_0050. O resto 8 corresponde a 8 ÷ 4 = bit 2. Conferindo: 0x2200_0000 + 0x50 × 32 + 2 × 4 = 0x2200_0A00 + 0x08 = 0x2200_0A08.
  fonte: "Joseph Yiu, The Definitive Guide to ARM Cortex-M3 and Cortex-M4 Processors, 3ª ed., capítulo Memory System, seção Bit-band operations"
  origem: ia
  revisao: rascunho
