id: M1.6
ato: A1
nome: "ESP32 e ESP-IDF"
missao: "A Vila da Forja ganhou um ferreiro que fala pelo ar: domine o ESP32 do módulo ao último bit da flash, faça a máquina entrar na rede da vila, conversar por Bluetooth, dormir com uma pilha por meses e receber firmware novo sem sair do lugar, e desenhe no caderno a primeira placa que um dia vai levar a sua marca."
horas: 180
trilha: firmware
ordem: 13
requer: ["M1.2"]
tags_chefe: []
# Ordem didática: família ESP32 (o chip e o módulo por trás do DevKit: Xtensa × RISC-V, memória, strapping pins e a placa mínima, que liga o módulo ao sonho da placa própria) → ESP-IDF (idf.py, componentes, CMake, Kconfig/sdkconfig, boot até o app_main e o mínimo de FreeRTOS para trabalhar) → logs e monitor (vem cedo de propósito: é a ferramenta de depuração de todos os tópicos seguintes; ler pânicos e backtraces exige saber o que o build gera) → partições e NVS (onde cada byte da flash mora; a NVS é pré-requisito do Wi-Fi e do BLE e a tabela de partições é pré-requisito da OTA) → periféricos (GPIO matrix, LEDC, ADC calibrado, RMT e toque: o salto do AVR do M1.2 para os periféricos do ESP32, sem rádio ainda) → Wi-Fi (o primeiro elite: o sistema de eventos, station, AP e provisionamento) → BLE (o segundo rádio, com GAP e GATT sobre NimBLE) → deep sleep e ULP (só depois dos rádios dá para fazer o orçamento de energia completo: acordar, conectar, transmitir, dormir) → OTA básica (fecha o módulo juntando partições, Wi-Fi, logs e rollback: o firmware que se atualiza sozinho em campo).
topicos:
  - id: M1.6.T01
    nome: "Família ESP32 (Xtensa, RISC-V, variantes C3/S3/C6)"
    tipo: comum
    peso: 1
    objetivos:
      - id: O1
        texto: "Comparar as variantes ESP32, ESP32-S2, ESP32-S3, ESP32-C3 e ESP32-C6 quanto ao núcleo (Xtensa LX6/LX7 ou RISC-V), número de núcleos, memória, rádios e USB e escolher a variante adequada a um produto"
      - id: O2
        texto: "Descrever a organização interna do ESP32 (CPUs, ROM, SRAM, memória RTC, flash e PSRAM externas acessadas pelo cache e pela MMU) e o caminho do código da flash até a execução"
      - id: O3
        texto: "Identificar os pinos de strapping, os pinos reservados à flash e à PSRAM e as restrições de GPIO de cada variante e escolher pinos seguros para um projeto"
      - id: O4
        texto: "Especificar a placa mínima de um ESP32 (módulo × chip, regulador de 3,3 V e corrente de pico, desacoplamento, antena e área livre, EN e BOOT, auto-reset por DTR/RTS ou USB-Serial/JTAG) a partir das Hardware Design Guidelines"
  - id: M1.6.T02
    nome: "ESP-IDF, menuconfig, componentes"
    tipo: comum
    peso: 1
    objetivos:
      - id: O1
        texto: "Usar o idf.py para criar, configurar, compilar, gravar e monitorar um projeto (set-target, menuconfig, build, flash, monitor, size) e explicar a estrutura de pastas de um projeto ESP-IDF"
      - id: O2
        texto: "Organizar o firmware em componentes com CMakeLists.txt (idf_component_register, SRCS, INCLUDE_DIRS, REQUIRES e PRIV_REQUIRES) e usar o gerenciador de componentes (idf_component.yml)"
      - id: O3
        texto: "Criar opções próprias com Kconfig e explicar o papel do sdkconfig, do sdkconfig.defaults e do sdkconfig.h gerado, decidindo o que vai para o controle de versão"
      - id: O4
        texto: "Explicar a sequência de boot até o app_main e usar o mínimo de FreeRTOS do ESP-IDF: app_main como tarefa, xTaskCreate com pilha em bytes, vTaskDelay, filas e o watchdog de tarefas"
  - id: M1.6.T08
    nome: "Logs e monitor"
    tipo: comum
    peso: 1
    objetivos:
      - id: O1
        texto: "Usar a biblioteca de log do ESP-IDF (ESP_LOGE a ESP_LOGV, TAG, níveis padrão e máximo no menuconfig, esp_log_level_set) e escolher o nível de cada mensagem"
      - id: O2
        texto: "Tratar erros com esp_err_t, esp_err_to_name, ESP_ERROR_CHECK e ESP_RETURN_ON_ERROR e decidir entre abortar e recuperar"
      - id: O3
        texto: "Usar o idf.py monitor (filtro de logs, decodificação de endereços, atalhos de reset e de gravação) e escolher a saída do console (UART0 ou USB-Serial/JTAG)"
      - id: O4
        texto: "Interpretar mensagens de pânico, backtraces, resets de watchdog e o motivo de reset (esp_reset_reason) e usar o core dump para depurar falhas depois do fato"
  - id: M1.6.T03
    nome: "Partições e NVS"
    tipo: comum
    peso: 1
    objetivos:
      - id: O1
        texto: "Ler e escrever tabelas de partições em CSV (nome, tipo, subtipo, offset, tamanho, flags) e calcular offsets, alinhamentos e espaço livre na flash"
      - id: O2
        texto: "Explicar o mapa da flash (bootloader, tabela de partições, aplicações e dados) e como o bootloader de segundo estágio escolhe a aplicação a executar"
      - id: O3
        texto: "Usar a NVS (nvs_flash_init, namespaces, handles, nvs_set/nvs_get, commit e blobs) e tratar os erros de partição sem páginas livres e de versão nova"
      - id: O4
        texto: "Montar sistemas de arquivos na flash (SPIFFS, LittleFS e FAT com wear levelling) pelo VFS e escolher entre NVS e sistema de arquivos para cada tipo de dado"
  - id: M1.6.T07
    nome: "Periféricos (RMT, LEDC, touch)"
    tipo: comum
    peso: 1
    objetivos:
      - id: O1
        texto: "Configurar GPIOs com o driver gpio (gpio_config, pull-ups, interrupções pelo serviço de ISR) e explicar como o IO MUX e a GPIO matrix ligam sinais de periféricos aos pinos"
      - id: O2
        texto: "Gerar PWM com o LEDC (timer, canal, resolução, frequência e fade por hardware) e calcular a relação entre clock de origem, frequência e resolução"
      - id: O3
        texto: "Medir tensões com o ADC do ESP32 (driver oneshot, atenuação e faixa útil, não linearidade, calibração com adc_cali) e reconhecer quando é preciso um ADC externo"
      - id: O4
        texto: "Gerar sinais temporizados com o RMT (fita WS2812, controle remoto IR) e ler os sensores de toque capacitivo com limiar calibrado"
  - id: M1.6.T04
    nome: "Wi-Fi (station, AP, provisionamento)"
    tipo: elite
    peso: 2
    objetivos:
      - id: O1
        texto: "Explicar o sistema de eventos do ESP-IDF (esp_event, loop padrão, WIFI_EVENT e IP_EVENT) e a sequência de inicialização do Wi-Fi (NVS, esp_netif, esp_wifi_init, modo, configuração e start)"
      - id: O2
        texto: "Conectar em modo station com espera por IP via event group, reconexão com recuo e tratamento dos motivos de desconexão"
      - id: O3
        texto: "Configurar os modos AP e AP+STA e servir uma página com o esp_http_server, respeitando os limites de canal, de clientes e de segurança"
      - id: O4
        texto: "Provisionar as credenciais de Wi-Fi sem gravá-las no código (wifi_provisioning por BLE ou SoftAP, SmartConfig, portal próprio) e comparar os métodos em segurança e experiência do usuário"
  - id: M1.6.T05
    nome: "BLE (GAP, GATT)"
    tipo: elite
    peso: 2
    objetivos:
      - id: O1
        texto: "Explicar a pilha BLE no ESP32 (controlador, HCI e host, Bluedroid × NimBLE), os papéis de GAP e o conteúdo de um pacote de advertising"
      - id: O2
        texto: "Modelar dados em GATT (serviço, característica, descritor, UUIDs de 16 e 128 bits, propriedades read, write, notify e indicate e o CCCD)"
      - id: O3
        texto: "Implementar com NimBLE um periférico GATT que anuncia, aceita conexão e expõe uma característica de leitura, escrita e notificação"
      - id: O4
        texto: "Calcular e ajustar o intervalo de advertising, o intervalo de conexão, o MTU e a vazão e testar o dispositivo com nRF Connect ou bluetoothctl"
  - id: M1.6.T06
    nome: "Deep sleep e ULP"
    tipo: elite
    peso: 2
    objetivos:
      - id: O1
        texto: "Comparar os modos de energia do ESP32 (ativo, modem sleep, light sleep, deep sleep e hibernação) quanto ao que fica ligado, ao consumo típico e ao que acontece ao acordar"
      - id: O2
        texto: "Configurar as fontes de despertar (timer, ext0, ext1, GPIO, toque e ULP), identificar a causa do despertar e preservar estado na memória RTC com RTC_DATA_ATTR"
      - id: O3
        texto: "Calcular o consumo médio e a autonomia de bateria de um ciclo acordar-medir-transmitir-dormir e identificar o que domina o orçamento, inclusive a placa"
      - id: O4
        texto: "Programar o coprocessador ULP (FSM no ESP32, RISC-V ou LP core nas variantes novas) para amostrar um sensor durante o deep sleep e acordar a CPU só quando necessário"
  - id: M1.6.T09
    nome: "OTA básica"
    tipo: elite
    peso: 2
    objetivos:
      - id: O1
        texto: "Explicar o esquema de partições de OTA (factory, ota_0, ota_1 e otadata) e o ciclo de atualização: gravar na partição livre, trocar a partição de boot e reiniciar"
      - id: O2
        texto: "Implementar a atualização por HTTPS com esp_https_ota ou com a API esp_ota_ops, conferindo a versão da imagem e o certificado do servidor"
      - id: O3
        texto: "Usar o rollback de aplicação (estado pending verify, esp_ota_mark_app_valid_cancel_rollback e esp_ota_mark_app_invalid_rollback_and_reboot) para voltar à versão anterior quando a nova falha"
      - id: O4
        texto: "Avaliar a segurança e a robustez da OTA (TLS, assinatura com Secure Boot, anti-rollback, criptografia da flash, queda de energia no meio da gravação) e dimensionar as partições para o crescimento do firmware"
