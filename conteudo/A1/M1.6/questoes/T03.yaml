- id: Q-M1.6.T03-001
  objetivo: O1
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Na tabela de partições do ESP-IDF, a que múltiplo deve estar alinhado o offset de uma partição do tipo app?
  alternativas:
    - "0x100 (256 bytes)"
    - "0x1000 (4 KB)"
    - "0x10000 (64 KB)"
    - "0x100000 (1 MB)"
  resposta: 2
  explicacao: |
    Partições app começam em múltiplos de 0x10000 (64 KB), por causa do mapeamento da flash pela MMU; partições data, em múltiplos de 0x1000 (4 KB), o setor de apagamento. O gerador recusa uma app desalinhada e alinha sozinho quando o offset fica em branco.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, Offset & Size"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-002
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    A tabela pronta "Factory app, two OTA definitions" (nvs 0x4000, otadata 0x2000, phy_init 0x1000, factory 1M, ota_0 1M, ota_1 1M, com a tabela de partições em 0x8000) termina em 0x310000. Quanto espaço sobra no fim de uma flash de 4 MB? Responda em KB (1 KB = 1024 bytes), com um número inteiro.
  resposta: {valor: 960, unidade: "KB", tolerancia: 0}
  explicacao: |
    4 MB = 0x400000. Sobra 0x400000 − 0x310000 = 0xF0000 = 983 040 bytes = 960 KB, onde cabe, por exemplo, uma partição de sistema de arquivos.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, Built-in Partition Tables; components/partition_table/partitions_two_ota.csv"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-003
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Uma tabela tem, nesta ordem e com offsets em branco: nvs de 0x7000, phy_init de 0x1000 e factory de 1M. A tabela de partições está no offset padrão 0x8000. Em que offset o gerador põe a partição factory? Responda em KB a partir do início da flash (1 KB = 1024 bytes), com um número inteiro.
  resposta: {valor: 128, unidade: "KB", tolerancia: 0}
  explicacao: |
    A nvs começa em 0x9000 e termina em 0x10000; a phy_init ocupa 0x10000 a 0x11000. A factory precisa de alinhamento de 64 KB: o próximo múltiplo de 0x10000 a partir de 0x11000 é 0x20000 = 131 072 bytes = 128 KB. Os 60 KB entre 0x11000 e 0x20000 ficam sem uso.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, Offset & Size"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-004
  objetivo: O1
  tipo: multipla
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Marque as afirmações corretas sobre o CSV da tabela de partições do ESP-IDF.
  alternativas:
    - "Um offset deixado em branco é preenchido pelo gerador, logo depois da partição anterior e respeitando o alinhamento do tipo"
    - "A flag readonly pode ser usada em partições data como a de dados de fábrica, mas não nas de subtipo ota e coredump"
    - "Uma linha 'config, data, factory, , 64K,' declara uma partição de dados válida"
    - "O tamanho de uma partição app deve ser múltiplo de 4 KB"
  resposta: [0, 1, 3]
  explicacao: |
    O gerador (gen_esp32part.py) resolve offsets em branco com alinhamento; readonly vale para data, exceto ota e coredump; o tamanho de app deve ser múltiplo do setor de 4 KB. O subtipo factory pertence ao tipo app: para dados, os subtipos são ota, phy, nvs, coredump, nvs_keys, fat, spiffs, littlefs etc.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, Creating Custom Tables (SubType, Offset & Size, Flags)"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-005
  objetivo: O2
  tipo: unica
  dificuldade: 2
  bloom: entender
  enunciado: |
    A tabela de partições tem factory, ota_0, ota_1 e otadata, mas a partição otadata está apagada (só 0xFF). Que aplicação o bootloader executa?
  alternativas:
    - "A ota_0, porque é o slot OTA de número mais baixo"
    - "A factory"
    - "Nenhuma: o boot falha até que a otadata seja gravada"
    - "A ota_1, porque é a mais recente"
  resposta: 1
  explicacao: |
    Com a otadata vazia, o bootloader executa a factory; só sem factory ele cai para a ota_0. Quando uma OTA termina, esp_ota_set_boot_partition grava na otadata qual slot usar.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, SubType (factory); API Reference, Over The Air Updates (OTA)"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-006
  objetivo: O2
  tipo: vf
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    Verdadeiro ou falso: a atualização OTA do ESP-IDF nunca grava na partição factory, que fica disponível como versão de fábrica para recuperação.
  resposta: true
  explicacao: |
    A OTA escreve só nos slots ota_N. A factory continua com a versão original; o reset de fábrica do bootloader pode apagar a otadata para voltar a ela. Para economizar flash, é possível dispensar a factory e usar ota_0 no lugar.
  fonte: "ESP-IDF Programming Guide, API Guides, Partition Tables, SubType"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-007
  objetivo: O2
  tipo: unica
  dificuldade: 3
  bloom: aplicar
  enunciado: |
    Você vai gravar à mão, com o esptool.py, os três binários de um projeto para ESP32-C3 com a tabela de partições padrão. Quais são os offsets corretos de bootloader, tabela de partições e aplicação?
  alternativas:
    - "0x1000, 0x8000 e 0x10000"
    - "0x0, 0x8000 e 0x10000"
    - "0x0, 0x1000 e 0x8000"
    - "0x1000, 0x9000 e 0x20000"
  resposta: 1
  explicacao: |
    Nos ESP32-S3, C3 e C6 o bootloader de segundo estágio fica no offset 0x0; no ESP32 original e no S2, em 0x1000. A tabela de partições fica em 0x8000 e a aplicação inicial em 0x10000 em todos, com a configuração padrão.
  fonte: "ESP-IDF Programming Guide (ESP32-C3), API Guides, Bootloader e Partition Tables; saída de idf.py build"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-008
  objetivo: O3
  tipo: unica
  dificuldade: 1
  bloom: lembrar
  enunciado: |
    `nvs_flash_init()` devolveu ESP_ERR_NVS_NO_FREE_PAGES. Qual é o tratamento padrão usado nos exemplos do ESP-IDF?
  alternativas:
    - "Chamar nvs_flash_erase() e depois nvs_flash_init() de novo"
    - "Reiniciar o chip com esp_restart() até a NVS se recuperar sozinha"
    - "Ignorar o erro e seguir sem NVS"
    - "Aumentar a partição NVS em tempo de execução"
  resposta: 0
  explicacao: |
    Sem páginas livres (ou com ESP_ERR_NVS_NEW_VERSION_FOUND, formato antigo), o padrão é apagar a partição e inicializar de novo. Isso perde os dados guardados; num produto, avalie antes. Reiniciar não resolve e o Wi-Fi não funciona sem NVS.
  fonte: "ESP-IDF, examples/storage/nvs_rw_value; ESP-IDF Programming Guide, API Reference, Non-Volatile Storage Library"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-009
  objetivo: O3
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Cada página da NVS tem 4096 bytes e 126 entradas de 32 bytes. Quantas entradas, no total, tem uma partição NVS de 0x5000 bytes? Responda com um número inteiro.
  resposta: {valor: 630, unidade: "entradas", tolerancia: 0}
  explicacao: |
    0x5000 = 20 480 bytes = 5 páginas de 4096 bytes. 5 × 126 = 630 entradas. (O restante de cada página é o cabeçalho de 32 bytes e o mapa de estado de 32 bytes.) Uma página fica reservada para a coleta de lixo.
  fonte: "ESP-IDF Programming Guide, API Reference, Non-Volatile Storage Library, Internals (Pages, Entry and Entry State Bitmap)"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-010
  objetivo: O3
  tipo: multipla
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Marque as afirmações corretas sobre a NVS do ESP-IDF.
  alternativas:
    - "Chaves e nomes de namespace têm no máximo 15 caracteres"
    - "Receber ESP_ERR_NVS_NOT_FOUND num nvs_get_u32 no primeiro boot é normal e deve ser tratado com um valor padrão"
    - "Os valores são cifrados por padrão, então senhas de Wi-Fi ficam protegidas sem configuração adicional"
    - "Alterar um valor grava uma nova entrada e marca a antiga como apagada, o que distribui o desgaste da flash"
  resposta: [0, 1, 3]
  explicacao: |
    O limite é de 15 caracteres (16 com o terminador). NOT_FOUND é o "ainda não existe". A NVS é um log de pares chave-valor, o que espalha o desgaste e resiste a quedas de energia. Ela não é cifrada por padrão: a NVS Encryption precisa ser habilitada (com nvs_keys e criptografia da flash ou com HMAC).
  fonte: "ESP-IDF Programming Guide, API Reference, Non-Volatile Storage Library (Keys and Values, Namespaces, Security, Internals)"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-011
  objetivo: O3
  tipo: numerica
  dificuldade: 4
  bloom: avaliar
  enunciado: |
    Use o modelo simplificado do roteiro: numa partição NVS com P páginas de 126 entradas, se só um valor muda, cada setor é apagado uma vez a cada P × 126 gravações, e cada setor suporta 100 000 apagamentos. Um firmware grava um contador numa NVS de 0x4000 bytes a cada 30 s, sem parar. Em quantos anos (de 365 dias) a flash chega ao limite? Responda em anos, com 1 casa decimal.
  resposta: {valor: 47.9, unidade: "anos", tolerancia: 0.01}
  explicacao: |
    0x4000 = 16 KB = 4 páginas → 4 × 126 = 504 gravações por apagamento de cada setor. Limite: 504 × 100 000 = 50,4 milhões de gravações. Por ano: 365 × 24 × 3600 / 30 = 1 051 200 gravações. 50 400 000 / 1 051 200 ≈ 47,9 anos. A cada segundo seriam só ~1,6 ano: grave quando mudar, não por relógio.
  fonte: "ESP-IDF Programming Guide, API Reference, Non-Volatile Storage Library, Internals; modelo simplificado do roteiro M1.6.T03"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-012
  objetivo: O4
  tipo: unica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Um registrador de dados grava arquivos CSV em subpastas por dia, na flash interna, e pode perder a alimentação a qualquer momento. Os arquivos não precisam ser lidos diretamente por um PC. Qual sistema de arquivos atende melhor?
  alternativas:
    - "SPIFFS"
    - "FAT sem wear levelling"
    - "NVS com um blob por linha"
    - "LittleFS"
  resposta: 3
  explicacao: |
    O LittleFS tem diretórios e foi projetado para resistir a quedas de energia (copy-on-write), com desgaste distribuído. O SPIFFS não tem diretórios e pode corromper numa queda; FAT sem wear levelling gasta sempre os mesmos setores; a NVS não é feita para arquivos crescentes.
  fonte: "ESP-IDF Programming Guide, API Reference, Storage (SPIFFS Filesystem, FAT Filesystem Support, Wear Levelling API); README do componente joltwallet/littlefs"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-013
  objetivo: O4
  tipo: vf
  dificuldade: 2
  bloom: entender
  enunciado: |
    Verdadeiro ou falso: com o SPIFFS montado em /spiffs, criar o arquivo /spiffs/logs/a.txt cria um diretório logs com o arquivo a.txt dentro.
  resposta: false
  explicacao: |
    O SPIFFS não suporta diretórios: a estrutura é plana, e o arquivo criado se chama literalmente "/logs/a.txt". Para diretórios de verdade, use LittleFS ou FAT.
  fonte: "ESP-IDF Programming Guide, API Reference, Storage, SPIFFS Filesystem (Notes)"
  origem: ia
  revisao: rascunho

- id: Q-M1.6.T03-014
  objetivo: O4
  tipo: multipla
  dificuldade: 3
  bloom: avaliar
  enunciado: |
    Marque as escolhas adequadas de onde guardar cada dado num produto com ESP32.
  alternativas:
    - "A senha do Wi-Fi digitada pelo usuário: NVS"
    - "Uma imagem de firmware novo baixada da internet: um arquivo no LittleFS, para gravar depois"
    - "O número de série gravado na fábrica: NVS numa partição própria com a flag readonly, gerada no PC com nvs_partition_gen.py"
    - "As páginas HTML do portal de configuração: sistema de arquivos gerado no build a partir de uma pasta do projeto"
  resposta: [0, 2, 3]
  explicacao: |
    Valores pequenos e configurações vão para a NVS; dados de fábrica, para uma NVS separada e protegida contra escrita; arquivos estáticos, para um sistema de arquivos gerado no build. Firmware novo vai direto para a partição ota_N livre (T09): passar por um arquivo exige espaço dobrado e não é o fluxo do ESP-IDF.
  fonte: "ESP-IDF Programming Guide, API Reference, Non-Volatile Storage Library e NVS Partition Generator Utility; API Guides, Partition Tables (Flags); API Reference, Over The Air Updates (OTA)"
  origem: ia
  revisao: rascunho
