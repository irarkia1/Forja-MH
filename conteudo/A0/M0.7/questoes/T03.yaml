- id: Q-M0.7.T03-001
  objetivo: O1
  tipo: numerica
  dificuldade: 1
  bloom: aplicar
  enunciado: |
    Qual número este programa imprime?
    ```python
    x = 7
    y = 2
    print(x // y + x % y)
    ```
  resposta: {valor: 4, unidade: "", tolerancia: 0}
  explicacao: |
    `//` é a divisão inteira (7 // 2 = 3) e `%` é o resto (7 % 2 = 1); 3 + 1 = 4. Quem usa `/` no lugar de `//` chega a 4.5 (3.5 + 1).
  fonte: "The Python Tutorial (docs.python.org), seção 3.1.1 Numbers"
  origem: ia
  revisao: rascunho

- id: Q-M0.7.T03-002
  objetivo: O1
  tipo: unica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    O que este programa imprime?
    ```python
    print(10 / 5, 10 // 4, type(10 / 5).__name__)
    ```
  alternativas:
    - "`2 2 int`"
    - "`2.0 2 float`"
    - "`2.0 2.5 float`"
    - "`2 2.5 int`"
  resposta: 1
  explicacao: |
    Em Python 3, `/` **sempre** devolve float, mesmo quando a divisão é exata: 10 / 5 = `2.0`, do tipo `float`. `//` é divisão inteira: 10 // 4 = `2`. Esperar `2` (int) para `10 / 5` é hábito de C ou de Python 2.
  fonte: "The Python Tutorial (docs.python.org), seção 3.1.1 Numbers"
  origem: ia
  revisao: rascunho

- id: Q-M0.7.T03-003
  objetivo: O1
  tipo: numerica
  dificuldade: 2
  bloom: aplicar
  enunciado: |
    Qual número este programa imprime?
    ```python
    def resistor_led(v_fonte, v_f=2.0, i=0.010):
        return (v_fonte - v_f) / i

    print(round(resistor_led(5, i=0.020)))
    ```
  resposta: {valor: 150, unidade: "Ω", tolerancia: 0}
  explicacao: |
    `v_f` não foi passado e usa o padrão 2.0; `i` foi passado por nome e vale 0.020. (5 − 2) / 0,020 = 150. Quem responde 300 usou o `i` padrão (0.010), ignorando o argumento nomeado.
  fonte: "The Python Tutorial (docs.python.org), seções 4.8.1 Default Argument Values e 4.8.2 Keyword Arguments"
  origem: ia
  revisao: rascunho

- id: Q-M0.7.T03-004
  objetivo: O1
  tipo: numerica
  dificuldade: 3
  bloom: analisar
  enunciado: |
    Qual número este programa imprime?
    ```python
    leituras = [3.31, 3.29, -1, 3.30, 0, 3.35, 99, 3.28]
    soma = 0
    for v in leituras:
        if v < 0:
            continue
        if v > 50:
            break
        soma += v
    print(round(soma, 2))
    ```
  resposta: {valor: 13.25, unidade: "", tolerancia: 0.0001}
  explicacao: |
    `continue` pula só o −1; o 0 não é negativo e entra na soma (sem mudar nada); ao chegar no 99, `break` encerra o laço e o 3.28 nunca é visto. Soma: 3,31 + 3,29 + 3,30 + 0 + 3,35 = 13,25. Quem soma também o 3.28 (16,53) tratou `break` como `continue`.
  fonte: "The Python Tutorial (docs.python.org), seção 4.4 break and continue Statements"
  origem: ia
  revisao: rascunho

- id: Q-M0.7.T03-005
